<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World AI Size Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/static/style.css"></head><body><div id="app"><div id="map"></div><header class="top"><div class="brand"><b>🌐 World AI Size Map</b><small>TrueSize · OpenStreetMap · AI</small></div><div class="search"><input id="q" placeholder="Search country, region, city or place…"><button id="go">⌕</button><div id="results" class="results hidden"></div></div><button id="settings">⚙</button></header><aside class="panel"><div class="head"><div><b>On the map</b><small id="count">0 places</small></div><button id="clear">Clear all</button></div><div id="list" class="list"><p>Search for a country, region or place.</p></div></aside><aside id="settingsPanel" class="panel settings hidden"><div class="head"><b>Settings</b><button id="close">×</button></div><label class="toggle"><span><b>AI images</b><small>Generate an image for new places</small></span><input id="images" type="checkbox"><i></i></label></aside><div class="sphere"><div class="globe">🌍</div><span>WORLD AI</span></div><div class="hint">Drag territories to compare their real size at different latitudes.</div><div id="toast" class="toast hidden"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/static/app.js"></script></body></html>
